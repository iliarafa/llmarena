name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: llmarena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d llmarena_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Local service container only. Never a Supabase URL or a live Stripe key.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/llmarena_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
